<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--grid:#e6e9e2;--snake:#2f7d4f;--head:#1d5c37;--food:#d94f3d;--text:#1c2320;--muted:#6b756f;--accent:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--grid:#242c28;--snake:#5fc887;--head:#8ee6ac;--food:#ff7a68;--text:#e8efe9;--muted:#93a099;--accent:#5fc887}}
:root[data-theme="dark"]{--bg:#121614;--card:#1b211e;--grid:#242c28;--snake:#5fc887;--head:#8ee6ac;--food:#ff7a68;--text:#e8efe9;--muted:#93a099;--accent:#5fc887}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
.bar{width:100%;max-width:420px;display:flex;justify-content:space-between;font-weight:600}
.bar span small{color:var(--muted);font-weight:500;margin-right:4px}
.wrap{position:relative;width:100%;max-width:420px}
canvas{width:100%;aspect-ratio:1;display:block;background:var(--card);border-radius:14px;border:1px solid var(--grid);touch-action:none}
.ov{position:absolute;inset:0;border-radius:14px;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.ov.hide{display:none}
.ov h1{margin:0;font-size:1.8rem}
.ov p{margin:0;color:var(--muted)}
button{font:inherit;cursor:pointer}
.play{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 26px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;margin-top:4px}
.pad button{background:var(--card);color:var(--text);border:1px solid var(--grid);border-radius:12px;font-size:1.3rem}
.pad button:active{background:var(--grid)}
.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<div class="bar"><span><small>Score</small><b id="sc">0</b></span><span><small>Best</small><b id="hi">0</b></span></div>
<div class="wrap">
<canvas id="c" width="420" height="420"></canvas>
<div class="ov" id="ov"><h1 id="t">Snake</h1><p id="m">Arrow keys, WASD or swipe</p><button class="play" id="go">Play</button></div>
</div>
<div class="pad">
<button class="u" data-d="0,-1" aria-label="Up">▲</button>
<button class="l" data-d="-1,0" aria-label="Left">◀</button>
<button class="d" data-d="0,1" aria-label="Down">▼</button>
<button class="r" data-d="1,0" aria-label="Right">▶</button>
</div>
<div class="hint">Space or P to pause</div>
<script>
(function(){
var N=21,cv=document.getElementById('c'),x=cv.getContext('2d'),S=cv.width/N;
var sc=document.getElementById('sc'),hiEl=document.getElementById('hi'),ov=document.getElementById('ov'),
t=document.getElementById('t'),m=document.getElementById('m'),go=document.getElementById('go');
var snake,dir,queue,food,score,hi=0,state='idle',timer;
try{hi=parseInt(localStorage.getItem('snake-hi'),10)||0}catch(e){}
hiEl.textContent=hi;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function reset(){var c=Math.floor(N/2);snake=[{x:c,y:c},{x:c-1,y:c},{x:c-2,y:c}];dir={x:1,y:0};queue=[];score=0;sc.textContent=0;placeFood()}
function placeFood(){var f;do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(function(s){return s.x===f.x&&s.y===f.y}));food=f}
function speed(){return Math.max(65,140-score*4)}
function start(){reset();state='run';ov.classList.add('hide');draw();loop()}
function loop(){clearTimeout(timer);if(state!=='run')return;step();if(state==='run')timer=setTimeout(loop,speed())}
function turn(dx,dy){
  if(state==='idle'||state==='over')return;
  if(state==='pause'){toggle()}
  var last=queue.length?queue[queue.length-1]:dir;
  if(dx===-last.x&&dy===-last.y||dx===last.x&&dy===last.y)return;
  if(queue.length<3)queue.push({x:dx,y:dy});
}
function step(){
  if(queue.length)dir=queue.shift();
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  var eat=h.x===food.x&&h.y===food.y;
  var body=eat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(function(s){return s.x===h.x&&s.y===h.y})){return over()}
  snake.unshift(h);
  if(eat){score++;sc.textContent=score;placeFood()}else snake.pop();
  draw();
}
function over(){
  state='over';draw();
  if(score>hi){hi=score;hiEl.textContent=hi;try{localStorage.setItem('snake-hi',hi)}catch(e){}}
  t.textContent='Game over';m.textContent='Score: '+score+'  ·  Best: '+hi;go.textContent='Play again';ov.classList.remove('hide');
}
function toggle(){
  if(state==='run'){state='pause';clearTimeout(timer);t.textContent='Paused';m.textContent='Space or P to resume';go.textContent='Resume';ov.classList.remove('hide')}
  else if(state==='pause'){state='run';ov.classList.add('hide');loop()}
}
function rr(px,py,w,r,col){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,w,r);x.fill()}
function draw(){
  x.clearRect(0,0,cv.width,cv.height);
  x.fillStyle=css('--grid');
  for(var i=0;i<N;i++)for(var j=0;j<N;j++)if((i+j)%2===0)x.fillRect(i*S,j*S,S,S);
  x.fillStyle=css('--food');x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.36,0,7);x.fill();
  for(var k=snake.length-1;k>=0;k--){var s=snake[k];rr(s.x*S+1.5,s.y*S+1.5,S-3,k?5:8,css(k?'--snake':'--head'))}
}
var keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
document.addEventListener('keydown',function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===' '||k==='p'){e.preventDefault();if(state==='idle'||state==='over')start();else toggle();return}
  if(keys[k]){e.preventDefault();turn(keys[k][0],keys[k][1])}
  else if(k==='Enter'&&(state==='idle'||state==='over'))start();
});
go.addEventListener('click',function(){if(state==='pause')toggle();else start()});
document.querySelectorAll('.pad button').forEach(function(b){
  b.addEventListener('click',function(){var d=b.dataset.d.split(',');turn(+d[0],+d[1])});
});
var sx,sy;
cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
},{passive:true});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='run')toggle()});
reset();draw();
})();
</script>
</body>
</html>
